<!DOCTYPE html>
<html lang="ro">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Task Manager</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/theme.js"></script>
        <script src="/config.js"></script>
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
    </script>
    </head>
    <body>
        <div class="main-container">

            <header class="main-header">
                <nav class="main-nav">
                    <a href="index.html">Acasă</a>
                    <a href="settings.html">Setări</a>
                    <a href="help.html">Heuristici</a>
                    <a href="logout.html">Deconectare</a>
                </nav>
                <h1><span class="logo">✔</span>Task Manager</h1>
                <p class="subtitle">Organize your tasks efficiently</p>
            </header>

            <div class="content">
                <form id="taskForm" class="task-form">
                    <div class="task-title">
                        <label for="title">Titlu sarcina:</label>
                        <input type="text" id="title" placeholder="Titlu" required>
                    </div>

                    <div class="task-description">
                        <label for="description">Descriere sarcina (optional)</label>
                        <input type="text" id="description" placeholder="Descriere...">
                    </div>

                    <div class="task-status">
                        <label for="status">Status:</label>
                        <select id="status">
                            <option value="todo">In asteptare</option>
                            <option value="in-progress">In curs de realizare</option>
                            <option value="done">Completat</option>
                        </select>
                    </div>

                    <div class="task-dueDate">
                        <label for="dueDate">Data scadenta:</label>
                        <input type="date" id="dueDate">
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary" onclick="handleAddTask();return false;">Adauga sarcina</button>
                        <button class="btn btn-secondary" onclick="window.reorderTaskFormFields && window.reorderTaskFormFields(); return false;">Rearanjează câmpurile</button>
                    </div>
                </form>
                <div class="info-box">Apasă pe câmpuri pentru a contoriza accesările. Aceste date sunt folosite pentru rearanjarea controalelor pe pagina.</div>

                <div class="tasks-list" id="tasksContainer">
                    <h2>Sarcinile tale</h2>
                </div>
            </div>

        </div>
    </body>
    <script src="js/auth.js"></script>
    <script src="js/addtask.js"></script>
    <script>
        window.initThemeFromStorage && window.initThemeFromStorage();
        window.attachControlTracking && window.attachControlTracking(['title','description','status','dueDate']);
        window.reorderTaskFormFields && window.reorderTaskFormFields();
        window.initTasksPage && window.initTasksPage();
    </script>
</html>
